    --grain: url("data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%27%20width%3D%27160%27%20height%3D%27160%27%3E%3Cfilter%20id%3D%27n%27%3E%3CfeTurbulence%20type%3D%27fractalNoise%27%20baseFrequency%3D%27.85%27%20numOctaves%3D%272%27%20stitchTiles%3D%27stitch%27%2F%3E%3CfeColorMatrix%20values%3D%270%200%200%200%201%20%200%200%200%200%201%20%200%200%200%200%201%20%200%200%200%20.06%200%27%2F%3E%3C%2Ffilter%3E%3Crect%20width%3D%27100%25%27%20height%3D%27100%25%27%20filter%3D%27url%28%23n%29%27%2F%3E%3C%2Fsvg%3E");
    color-scheme: dark;
    --bg: #0b3340; --panel: rgba(6, 33, 42, .93); --panel-hi: rgba(10, 48, 60, .92); --line: rgba(245, 239, 227, .14);
    --fg: #f5efe3; --muted: #b6cac6; --koi: #ff7a3d; --koi-deep: #e5552a; --gold: #f2c14e; --lotus: #f4a6c0; --leaf: #6fbf6a;
    --display: "Zen Old Mincho", "Iowan Old Style", Georgia, serif;
    --body: "Zen Kaku Gothic New", system-ui, sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
    --gut: clamp(16px, 4vw, 40px); --maxw: 1160px; --r: 20px;
  }
  
  html { scrollbar-gutter: stable; scroll-behavior: smooth; scroll-padding-top: 90px; -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.65 var(--body); overflow-x: hidden; }
  a { color: inherit; }
  :focus-visible { outline: 2px solid var(--gold); outline-offset: 3px; border-radius: 6px; }
  .sr, .skip:not(:focus) { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  .skip { position: fixed; top: 8px; left: 8px; z-index: 100; background: var(--gold); color: #1b1206; padding: 6px 12px; border-radius: 6px; }
  #pond { position: fixed; left: 0; top: 0; width: 100%; height: 100vh; height: 100lvh; z-index: 0; }
  #pond canvas { width: 100%; height: 100%; display: block; }
  #app { position: relative; z-index: 1; }
  [hidden] { display: none !important; }

  
  .panel { border: 1px solid var(--line); border-radius: var(--r);
    background: var(--seigaiha) top right / 240px 150px no-repeat, radial-gradient(120% 70% at 0% 0%, rgba(242, 193, 78, .06), transparent 60%), var(--grain), var(--panel);
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, .05), inset 0 0 0 1px rgba(242, 193, 78, .035), 0 24px 60px -34px rgba(0, 0, 0, .7); }
  .btn { display: inline-flex; align-items: center; gap: 8px; padding: 11px 20px; border-radius: 999px; border: 1px solid var(--line); background: rgba(6, 33, 42, .7); color: var(--fg); font: 500 15px var(--body); text-decoration: none; cursor: pointer; transition: transform .2s, background .2s, border-color .2s; }
  .btn:hover { transform: translateY(-2px); border-color: var(--gold); }
  .btn-koi { background: var(--koi); border-color: var(--koi); color: #1b0e06; }
  .btn-koi:hover { background-color: var(--koi); border-color: #ffb08a; }
  
  .btn { position: relative; overflow: hidden; isolation: isolate; background-image: linear-gradient(rgba(242, 193, 78, .16), rgba(242, 193, 78, .16)); background-repeat: no-repeat; background-position: bottom; background-size: 100% 0; transition: transform .2s, border-color .2s, background-size .35s ease; }
  .btn:hover { background-size: 100% 100%; }
  .btn-koi { background-image: linear-gradient(#ffa574, #ffa574); }
  .btn .arr { font-style: normal; display: inline-block; transition: transform .25s cubic-bezier(.3, 1.6, .5, 1); }
  .btn:hover .arr { transform: translateY(3px); }
  .btn:hover .arr:not(:first-child) { transform: translate(3px, 0); }
  .cta .btn:first-child:hover .arr { transform: translateY(3px); }
  .rpl { position: absolute; border-radius: 50%; pointer-events: none; background: radial-gradient(circle, rgba(255, 255, 255, .35), rgba(255, 255, 255, .12) 55%, transparent 70%); z-index: 0; }
  .pbtn, .hop-btn, .filters button, .link-chip, .pond-go, .still, .interest, .node, .repo, .skill-chip { position: relative; overflow: hidden; }

  
  .nav { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; display: flex; align-items: center; gap: 20px; padding: 12px var(--gut) 14px; background: rgba(5, 28, 36, .96); border-bottom: 1px solid var(--line); }
