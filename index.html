<style>

:root {
  --bg: #F8F8F5;
  --block: #ECEBE5;
  --panel: #FFFFFF;
  --side: #F6F6F2;
  --edge: #D9D8D0;
  --ink: #1B1B18;
  --mute: #6F6E67;
  --faint: #A09F97;
  --line: #E3E2DB;
  --lift: rgba(27, 27, 24, .04);
  --pressed: #E7E6DF;
  --tag: #ECEBE5;
  --tag-ink: #4C4B45;
  --ok: #17794F;
  --name-a: #1B1B18;
  --name-b: #1B1B18;
  --glow: rgba(255, 255, 255, 0);
  --shadow: 0 24px 60px -30px rgba(27, 27, 24, .35);
  --sans: "Geist", "Helvetica Neue", Arial, sans-serif;
  --mono: "Geist Mono", ui-monospace, Menlo, Consolas, monospace;
  --serif: "Newsreader", "Iowan Old Style", Georgia, serif;
  --ease: cubic-bezier(.22, .8, .22, 1);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0A0A0B; --block: #121214; --panel: #17171A; --side: #131315; --edge: rgba(255, 255, 255, .12);
    --ink: #F1F1EF; --mute: #9C9EA1; --faint: #62646A; --line: rgba(255, 255, 255, .09);
    --lift: rgba(255, 255, 255, .045); --pressed: rgba(255, 255, 255, .09);
    --tag: rgba(255, 255, 255, .07); --tag-ink: #C9CBCE; --ok: #62CF9E;
    --name-a: #FFFFFF; --name-b: #A9ABAE; --glow: rgba(255, 255, 255, .055);
    --shadow: 0 24px 60px -30px rgba(0, 0, 0, .9);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0A0A0B; --block: #121214; --panel: #17171A; --side: #131315; --edge: rgba(255, 255, 255, .12);
  --ink: #F1F1EF; --mute: #9C9EA1; --faint: #62646A; --line: rgba(255, 255, 255, .09);
  --lift: rgba(255, 255, 255, .045); --pressed: rgba(255, 255, 255, .09);
  --tag: rgba(255, 255, 255, .07); --tag-ink: #C9CBCE; --ok: #62CF9E;
  --name-a: #FFFFFF; --name-b: #A9ABAE; --glow: rgba(255, 255, 255, .055);
  --shadow: 0 24px 60px -30px rgba(0, 0, 0, .9);
  color-scheme: dark;
}
[hidden] { display: none !important; }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--mute); font: 400 15.5px/1.6 var(--sans); -webkit-font-smoothing: antialiased; transition: background-color .3s, color .3s; }
body::before { content: ""; position: fixed; inset: 0; pointer-events: none; background: radial-gradient(520px circle at var(--mx, 72%) var(--my, 10%), var(--glow), transparent 70%); }
@media (prefers-reduced-motion: no-preference) { html { scroll-behavior: smooth; } }
h1, h2, h3, p, ul, ol, dl, dd { margin: 0; padding: 0; font-size: inherit; font-weight: inherit; }
ul, ol { list-style: none; }
a { color: inherit; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; border-radius: 4px; }
.wrap { position: relative; max-width: 1320px; margin: 0 auto; padding-left: max(24px, env(safe-area-inset-left, 0px)); padding-right: max(24px, env(safe-area-inset-right, 0px)); display: grid; grid-template-columns: minmax(0, 4fr) minmax(0, 7fr); gap: 0 64px; }


.left { position: sticky; top: env(safe-area-inset-top, 0px); align-self: start; height: 100vh; max-height: 100dvh; padding-block: 84px 56px; display: flex; flex-direction: column; }
.left h1 { font: 400 clamp(42px, 4.4vw, 60px)/1 var(--serif); letter-spacing: -.02em; padding-bottom: .08em; background: linear-gradient(180deg, var(--name-a) 30%, var(--name-b)); -webkit-background-clip: text; background-clip: text; color: transparent; }
#role { color: var(--ink); font-size: 17px; margin-top: 12px; }
#line { max-width: 21em; margin-top: 10px; text-wrap: pretty; }
#line b { font-weight: 400; color: var(--ink); }
.nav { margin-top: 52px; display: grid; gap: 2px; justify-items: start; }
.nav a { display: flex; align-items: center; gap: 14px; padding: 7px 0; font-size: 12px; font-weight: 500; letter-spacing: .12em; text-transform: uppercase; text-decoration: none; color: var(--faint); transition: color .25s; }
.nav a::before { content: ""; width: 28px; height: 1px; background: currentColor; transition: width .35s var(--ease); }
.nav a:hover, .nav a.on { color: var(--ink); }
.nav a:hover::before, .nav a.on::before { width: 60px; }
.reach { margin-top: auto; display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.pill { display: inline-flex; align-items: center; height: 34px; padding: 0 14px; border-radius: 999px; border: 1px solid var(--line); background: transparent; color: var(--ink); font-size: 14px; text-decoration: none; white-space: nowrap; cursor: pointer; transition: border-color .2s, background-color .2s, transform .15s var(--ease); }
.pill:hover { border-color: var(--faint); }
.pill:active { transform: scale(.97); }
.pill.solid { background: var(--ink); border-color: var(--ink); color: var(--bg); }
.pill.solid:hover { opacity: .88; }
.theme { width: 34px; padding: 0; justify-content: center; margin-left: auto; }
.theme svg { width: 16px; height: 16px; transition: transform .5s var(--ease); }
.theme .moon { display: none; }
.theme[aria-pressed="true"] svg { transform: rotate(-90deg); }
.theme[aria-pressed="true"] .sun { display: none; }
.theme[aria-pressed="true"] .moon { display: block; }


.right { padding-block: 84px 56px; min-width: 0; }
section + section { margin-top: clamp(72px, 9vw, 112px); }
.sec-h { font-size: 12px; font-weight: 500; letter-spacing: .12em; text-transform: uppercase; color: var(--faint); margin-bottom: 18px; }


.stage { background: var(--block); border-radius: 8px; padding: clamp(12px, 3vw, 36px) clamp(10px, 3vw, 36px) 0; overflow: hidden; transition: background-color .3s; }
.win { background: var(--panel); border: 1px solid var(--edge); border-bottom: 0; border-radius: 10px 10px 0 0; box-shadow: var(--shadow); display: grid; grid-template-columns: 238px minmax(0, 1fr); grid-template-rows: auto 1fr; min-height: 560px; overflow: hidden; transition: background-color .3s, border-color .3s; }
.win-bar { grid-column: 1 / -1; display: flex; align-items: center; height: 34px; padding: 0 12px; border-bottom: 1px solid var(--line); font-size: 12.5px; }
.win-bar i { width: 9px; height: 9px; border-radius: 50%; background: var(--pressed); margin-right: 6px; }
.win-bar span { margin: 0 auto; transform: translateX(-22px); }
.side { border-right: 1px solid var(--line); background: var(--side); padding: 10px 8px 14px; transition: background-color .3s; }
.side h3 { font-size: 11px; font-weight: 500; letter-spacing: .06em; text-transform: uppercase; color: var(--faint); padding: 6px 10px; }
.side h3:not(:first-child) { margin-top: 10px; }
.side button { display: grid; grid-template-columns: 14px minmax(0, 1fr); align-items: center; column-gap: 9px; width: 100%; text-align: left; background: none; border: 0; border-radius: 6px; padding: 6px 10px; cursor: pointer; color: var(--mute); transition: background-color .15s, color .15s; }
.side button:hover { background: var(--lift); color: var(--ink); }
.side button[aria-pressed="true"] { background: var(--pressed); color: var(--ink); }
.side button span { font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.side svg { width: 14px; height: 14px; color: var(--faint); }
.side .spin { animation: spin 2.6s linear infinite; color: var(--ok); }
@keyframes spin { to { transform: rotate(360deg); } }

.pane { padding: 22px clamp(16px, 2.6vw, 32px) 26px; display: flex; flex-direction: column; min-width: 0; }
.pane-org { font-size: 12.5px; }
.pane h3 { font-size: 20px; font-weight: 500; letter-spacing: -.015em; color: var(--ink); margin-top: 2px; }
.pane-desc { max-width: 54ch; margin-top: 6px; text-wrap: pretty; }
.steps { margin-top: 18px; display: grid; gap: 2px; border-top: 1px solid var(--line); padding-top: 14px; }
.steps li { display: grid; grid-template-columns: 15px minmax(0, 1fr); column-gap: 10px; padding: 5px 0; font-size: 14.5px; color: var(--ink); max-width: 64ch; }
.steps svg { width: 15px; height: 15px; margin-top: 4px; color: var(--ok); }
.pane-foot { margin-top: auto; padding-top: 24px; display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 14px 20px; }
.stat b { display: block; font: 500 26px/1.1 var(--mono); letter-spacing: -.03em; color: var(--ink); font-variant-numeric: tabular-nums; }
.stat span { font-size: 13px; }
.src { display: flex; gap: 8px; font-size: 13px; }
.src a { display: inline-flex; align-items: center; gap: 5px; height: 30px; padding: 0 12px; border-radius: 999px; border: 1px solid var(--line); color: var(--ink); text-decoration: none; transition: border-color .2s; }
.src a:hover { border-color: var(--faint); }
.src svg { width: 11px; height: 11px; transition: transform .25s var(--ease); }
.src a:hover svg { transform: translate(1px, -1px); }
@media (prefers-reduced-motion: no-preference) {
  .pane:not(.quiet) > * { animation: rise .35s var(--ease) backwards; }
  .pane:not(.quiet) .steps li { animation: rise .35s var(--ease) backwards; animation-delay: calc(var(--i) * 220ms + 140ms); }
  .pane:not(.quiet) .steps path { stroke-dasharray: 10; animation: draw .3s ease-out backwards; animation-delay: calc(var(--i) * 220ms + 300ms); }
  .pane:not(.quiet) .pane-foot { animation-delay: calc(var(--n) * 220ms + 200ms); }
  @keyframes rise { from { opacity: 0; transform: translateY(5px); } }
  @keyframes draw { from { stroke-dashoffset: 10; } }
}

.tags { display: flex; flex-wrap: wrap; gap: 6px; }
.tags li { font-size: 12.5px; padding: 3px 10px; border-radius: 999px; background: var(--tag); color: var(--tag-ink); }


.job { display: grid; grid-template-columns: 150px minmax(0, 1fr); gap: 16px; border-radius: 8px; margin: 0 -18px; padding: 18px; transition: background-color .25s, opacity .25s; }
.job:hover { background: var(--lift); }
#exp:hover .job:not(:hover) { opacity: .5; }
.job-when { font-size: 12px; font-weight: 500; letter-spacing: .06em; text-transform: uppercase; color: var(--faint); padding-top: 4px; font-variant-numeric: tabular-nums; }
.job h3 { color: var(--ink); font-weight: 500; }
.job h3 span { font-weight: 400; }
.job p { font-size: 14.5px; margin-top: 5px; max-width: 62ch; text-wrap: pretty; }
.job .tags { margin-top: 12px; }


#say p { font-size: clamp(19px, 1.9vw, 24px); line-height: 1.36; letter-spacing: -.018em; max-width: 30em; text-wrap: pretty; }
#say p + p { margin-top: 16px; }
#say b { font-weight: 400; color: var(--ink); }
#facts { margin-top: 40px; border-top: 1px solid var(--line); }
#facts div { display: grid; grid-template-columns: 150px minmax(0, 1fr); gap: 16px; padding: 13px 0; border-bottom: 1px solid var(--line); font-size: 14.5px; }
#facts dt { color: var(--faint); }
#facts dd { color: var(--ink); max-width: 60ch; }


#blurb { font: 400 clamp(24px, 2.7vw, 34px)/1.22 var(--serif); letter-spacing: -.012em; color: var(--ink); max-width: 19em; text-wrap: balance; }
.mail { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 16px; margin-top: 26px; }
#mail { font: 500 15px var(--mono); color: var(--ink); overflow-wrap: anywhere; min-width: 0; }
footer { margin-top: 88px; padding-top: 18px; border-top: 1px solid var(--line); font-size: 13px; color: var(--faint); }

@media (max-width: 960px) {
  .wrap { grid-template-columns: minmax(0, 1fr); }
  .left { position: static; height: auto; padding-block: 64px 0; }
  .nav { display: none; }
  .reach { margin-top: 26px; }
  .right { padding-block: 56px 48px; }
}
@media (max-width: 640px) {
  .win { grid-template-columns: minmax(0, 1fr); min-height: 0; }
  .side { border-right: 0; border-bottom: 1px solid var(--line); display: flex; gap: 4px; overflow-x: auto; padding: 8px; scrollbar-width: none; }
  .side::-webkit-scrollbar { display: none; }
  .side h3 { display: none; }
  .side button { width: auto; flex: none; grid-template-columns: 14px auto; padding: 6px 10px; }
  .pane { min-height: 400px; }
  .job { grid-template-columns: minmax(0, 1fr); gap: 4px; margin: 0 -12px; padding: 14px 12px; }
  #facts div { grid-template-columns: minmax(0, 1fr); gap: 2px; }
}
</style>

</head>
<body>
<div class="wrap">
  <header class="left">
    <h1 id="name"></h1>
    <p id="role"></p>
    <p id="line"></p>
    <nav class="nav" aria-label="Sections">
      <a href="#work" class="on">Work</a><a href="#experience">Experience</a><a href="#about">About</a><a href="#contact">Contact</a>
    </nav>
    <div class="reach">
      <a class="pill" data-href="github" target="_blank" rel="noopener">GitHub</a>
      <a class="pill" data-href="linkedin" target="_blank" rel="noopener">LinkedIn</a>
      <button class="pill" type="button" data-copy>Copy email</button>
      <button class="pill theme" type="button" id="theme" aria-pressed="false" aria-label="Switch to dark theme">
        <svg class="sun" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" aria-hidden="true"><circle cx="8" cy="8" r="3"/><path d="M8 1.5v1.6M8 12.9v1.6M1.5 8h1.6M12.9 8h1.6M3.4 3.4l1.1 1.1M11.5 11.5l1.1 1.1M3.4 12.6l1.1-1.1M11.5 4.5l1.1-1.1"/></svg>
        <svg class="moon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13.4 9.6A5.6 5.6 0 0 1 6.4 2.6a5.6 5.6 0 1 0 7 7z" transform="rotate(90 8 8)"/></svg>
      </button>
    </div>
  </header>

  <main class="right">
    <section id="work">
      <h2 class="sec-h">Work</h2>
      <div class="stage">
        <div class="win">
          <div class="win-bar" aria-hidden="true"><i></i><i></i><i></i><span>Projects</span></div>
          <div class="side" id="side" role="group" aria-label="Projects"></div>
          <div class="pane" id="pane" aria-live="polite"></div>
        </div>
      </div>
    </section>

    <section id="experience">
      <h2 class="sec-h">Experience</h2>
      <div id="exp"></div>
    </section>

    <section id="about">
      <h2 class="sec-h">About</h2>
      <div id="say"></div>
      <dl id="facts"></dl>
    </section>

    <section id="contact">
      <h2 class="sec-h">Contact</h2>
      <p id="blurb"></p>
      <div class="mail"><span id="mail" data-email></span><button class="pill solid" type="button" data-copy>Copy email</button></div>
    </section>

    <footer><span id="open"></span></footer>
  </main>
</div>

<script src="content.js?v=c971cf0ae6"></script>
<script src="app.js?v=55cfabf2ad"></script>
